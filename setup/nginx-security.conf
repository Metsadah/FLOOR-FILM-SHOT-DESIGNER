# Floorboard self-host — the same security headers Netlify gets from _headers.
# Replace YOURPROJECT.supabase.co with your Supabase project host (see config.js).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' data: blob: https://YOURPROJECT.supabase.co wss://YOURPROJECT.supabase.co https://api.open-meteo.com https://geocoding-api.open-meteo.com; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), usb=(), interest-cohort=()" always;
